name: Submit leads

on:
  schedule:
    - cron: '*/15 * * * *'     # every 15 minutes (GitHub may delay runs a few minutes)
  workflow_dispatch:           # lets you press "Run workflow" manually

concurrency:
  group: submit-leads          # never run two at once
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node agent.js
        env:
          BRIDGE_URL: ${{ secrets.BRIDGE_URL }}
          BRIDGE_TOKEN: ${{ secrets.BRIDGE_TOKEN }}
          PAGE_URL: ${{ secrets.PAGE_URL }}     # leave this secret unset to use the demo page
